[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algoverse-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1", "pydantic>=2,<3", "sqlalchemy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "httpx>=0.24,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"app/schemas/models.py" = ["UP045"] # Python 3.9 Pydantic needs Optional at runtime.
