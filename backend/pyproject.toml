[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algoverse-backend"
version = "0.1.0"
requires-python = ">=3.9"
# OpenAPI snapshots are generated by these exact API stack versions.
# numpy/faiss-cpu are needed by D05 tests (app.ai.rag imports numpy at module level).
dependencies = [
  "fastapi==0.120.1",
  "starlette==0.48.0",
  "uvicorn>=0.23,<1",
  "pydantic==2.12.3",
  "sqlalchemy>=2,<3",
  "numpy>=1.24,<3",
  "faiss-cpu>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "httpx>=0.24,<1", "ruff==0.17.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"app/schemas/models.py" = ["UP045"] # Python 3.9 Pydantic needs Optional at runtime.
